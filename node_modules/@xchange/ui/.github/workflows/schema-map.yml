name: Regenerate schema map

on:
  push:
    paths:
      - "supabase/uploads/**"
      - "scripts/build-schema-map.ts"
      - ".github/workflows/schema-map.yml"
  pull_request:
    paths:
      - "supabase/uploads/**"
      - "scripts/build-schema-map.ts"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the auto-commit step can push back on push events
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate schema map
        run: npm run schema:map

      - name: Commit regenerated schema map
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain docs/schema-map.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/schema-map.md
            git commit -m "chore: regenerate schema map"
            git push
          else
            echo "schema-map.md is up to date"
          fi

      - name: Fail PR if schema map is out of date
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain docs/schema-map.md)" ]; then
            echo "::error::docs/schema-map.md is out of date. Run 'npm run schema:map' and commit the result."
            git --no-pager diff docs/schema-map.md
            exit 1
          fi
